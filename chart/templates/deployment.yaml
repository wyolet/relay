apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "relay.fullname" . }}
  labels:
    {{- include "relay.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "relay.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "relay.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
      annotations:
        # Roll pods when the rendered config/secret changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.secrets.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.auth.adminUser.enabled }}
        checksum/users: {{ include (print $.Template.BasePath "/users-configmap.yaml") . | sha256sum }}
        {{- end }}
        checksum/settings: {{ include (print $.Template.BasePath "/settings-configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "relay.serviceAccountName" . }}
      {{- $preStop := int .Values.relay.preStopSleepS }}
      terminationGracePeriodSeconds: {{ .Values.relay.terminationGracePeriodSeconds | default (add $preStop (int (.Values.relay.shutdownDeadlineS | default 15)) 10) }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Wait for relay's own data stores before starting (relay self-migrates PG
      # on boot; CH/Valkey are needed for the selected backends).
      initContainers:
        - name: wait-for-stores
          image: busybox:1.38
          resources:
            {{- toYaml .Values.initResources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["sh", "-c"]
          args:
            - |
              {{- if .Values.postgresql.enabled }}
              until nc -z {{ include "relay.postgresql.fullname" . }} 5432; do echo "waiting for postgres"; sleep 2; done
              {{- end }}
              {{- if .Values.clickhouse.enabled }}
              until nc -z {{ include "relay.clickhouse.fullname" . }} 9000; do echo "waiting for clickhouse"; sleep 2; done
              {{- end }}
              {{- if .Values.valkey.enabled }}
              until nc -z {{ include "relay.valkey.fullname" . }} 6379; do echo "waiting for valkey"; sleep 2; done
              {{- end }}
              echo "data stores reachable"
      containers:
        - name: relay
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.relay.port }}
            - name: control
              containerPort: {{ .Values.relay.controlPort }}
          envFrom:
            {{- include "relay.envFrom" . | nindent 12 }}
          env:
            {{- if and .Values.migrations.job.enabled .Release.IsUpgrade }}
            # The pre-upgrade Job has migrated; a pod stopped mid-migration would leave the schema dirty. Installs migrate on boot (no Job runs then).
            - name: RELAY_MIGRATE_ON_BOOT
              value: "off"
            {{- end }}
            {{- include "relay.env" . | nindent 12 }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            # Generous window: covers PG migrations + first-boot catalog seed. /healthz checks PG only until the pod is first ready.
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          {{- if gt $preStop 0 }}
          # The endpoint goes not-ready as soon as the pod is deleted, but the ingress learns it a moment later; serving through that moment keeps it from sending to a closed listener.
          lifecycle:
            preStop:
              sleep:
                seconds: {{ $preStop }}
          {{- end }}
          # Liveness is process-only (/livez has NO backend dependency): a PG/DNS
          # blip must NOT kill a healthy process — that cascades restarts
          # exactly when the backend is stressed. It probes the control port so
          # a pod whose inference listener is at RELAY_MAX_CONNS is not restarted
          # for being busy; a RELAY_CONTROL_LISTEN_HOST override may keep that
          # port off the pod IP, so it falls back to the inference port then.
          {{- $controlHostSet := false }}
          {{- range .Values.relay.extraEnv }}
          {{- if and (eq .name "RELAY_CONTROL_LISTEN_HOST") .value }}{{ $controlHostSet = true }}{{ end }}
          {{- end }}
          livenessProbe:
            httpGet:
              {{- if $controlHostSet }}
              path: /livez
              port: http
              {{- else }}
              path: /api/livez
              port: control
              {{- end }}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: state
              mountPath: /var/lib/relay
            - name: tmp
              mountPath: /tmp
            {{- if .Values.auth.adminUser.enabled }}
            # subPath mounts the single file (no ConfigMap ..data symlink tree),
            # so relay's recursive User loader can't read admin.yaml twice.
            - name: users
              mountPath: {{ .Values.auth.adminUser.configDir }}/admin.yaml
              subPath: admin.yaml
              readOnly: true
            {{- end }}
            # Seed settings (payload-logging, ...) — subPath per file so relay's
            # recursive loader can't read them twice via the ..data symlink tree.
            - name: settings
              mountPath: {{ .Values.relay.settingsDir }}/payload-logging.yaml
              subPath: payload-logging.yaml
              readOnly: true
            - name: settings
              mountPath: {{ .Values.relay.settingsDir }}/usage-logging.yaml
              subPath: usage-logging.yaml
              readOnly: true
      volumes:
        # readOnlyRootFilesystem -> writable scratch for the CH WAL + temp.
        - name: state
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if .Values.auth.adminUser.enabled }}
        - name: users
          configMap:
            name: {{ include "relay.fullname" . }}-users
        {{- end }}
        - name: settings
          configMap:
            name: {{ include "relay.fullname" . }}-settings
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
