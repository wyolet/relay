name: Full CI on dev

# Pull requests into dev run only the light CI tier. Every three hours this
# dispatches ci.yml on dev, unless dev's HEAD already had a dispatched run; the
# run executes in dev's context, so its checks land on that commit and its
# caches stay scoped to dev. When a dispatched run on dev finishes, a green one
# moves the ci-full-passed tag and release/next (scripts/release-pr.sh keeps
# the one release pull request into main up to date); a red one gets the range
# to bisect in this run's summary and starts fix-dev.yml. To run the full tier
# now: gh workflow run ci.yml --ref dev

on:
  schedule:
    - cron: '41 */3 * * *'
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev]

permissions:
  contents: read

env:
  PASSED_TAG: ci-full-passed
  # GitHub fires no workflow_run for a run started with the workflow token, and
  # starts no workflows for a pull request it opens or pushes; the CI app's
  # token does both.
  HAS_APP: ${{ vars.RELAY_CI_APP_ID != '' && secrets.RELAY_CI_APP_KEY != '' }}

jobs:
  dispatch:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELAY_CI_APP_ID }}
          private-key: ${{ secrets.RELAY_CI_APP_KEY }}
          permission-contents: read
          permission-actions: write

      - if: env.HAS_APP != 'true'
        run: echo "::warning::RELAY_CI_APP_ID or RELAY_CI_APP_KEY is not set; the dispatched run's result won't be recorded"

      - env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          repo="repos/$GITHUB_REPOSITORY"
          if ! sha=$(gh api "$repo/git/ref/heads/dev" --jq .object.sha 2>/dev/null); then
            echo "::notice::no dev branch; nothing to run"; exit 0
          fi
          runs=$(gh api "$repo/actions/workflows/ci.yml/runs?head_sha=$sha&event=workflow_dispatch&per_page=1" --jq .total_count)
          if [ "$runs" -gt 0 ]; then
            echo "::notice::dev ${sha::12} already had a full run"; exit 0
          fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref dev
          echo "dispatched ci.yml on dev ${sha::12}" >> "$GITHUB_STEP_SUMMARY"

  # Runs nothing from dev: the checkout is main's, and dev's history is only
  # read as git objects for the release notes.
  record:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          repo="repos/$GITHUB_REPOSITORY"
          # gh prints a 404's body to stdout, so a failed lookup must clear it.
          passed=$(gh api "$repo/git/ref/tags/$PASSED_TAG" --jq .object.sha 2>/dev/null) || passed=""

          if [ "$CONCLUSION" = success ]; then
            if [ -z "$passed" ]; then
              gh api -X POST "$repo/git/refs" -f ref="refs/tags/$PASSED_TAG" -f sha="$SHA" >/dev/null
            else
              # Runs can finish out of order; the tag only moves forward.
              rel=$(gh api "$repo/compare/$passed...$SHA" --jq .status)
              [ "$rel" = ahead ] || { echo "$PASSED_TAG stays at $passed ($SHA is $rel)"; exit 0; }
              gh api -X PATCH "$repo/git/refs/tags/$PASSED_TAG" -f sha="$SHA" -F force=true >/dev/null
            fi
            echo "$PASSED_TAG -> $SHA" >> "$GITHUB_STEP_SUMMARY"
            echo "moved=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "## Full CI $CONCLUSION on dev \`${SHA::12}\`"
            echo "Run: $RUN_URL"
            echo
            if [ -n "$passed" ]; then
              echo "Commits since the last green run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$passed...$SHA"
              echo
            fi
            echo "Bisect them, then fix forward with a pull request into dev naming the culprit, or \`git revert\` that one commit."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CONCLUSION" = failure ]; then
            gh workflow run fix-dev.yml --repo "$GITHUB_REPOSITORY" --ref dev \
              -f sha="$SHA" -f good="$passed" -f run_id="$RUN_ID"
            echo "Started fix-dev.yml." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 1

      - uses: actions/checkout@v7
        if: steps.tag.outputs.moved == 'true'
        with:
          fetch-depth: 0

      # The release pull request's checks report only when its own events
      # start workflows.
      - id: app
        if: steps.tag.outputs.moved == 'true' && env.HAS_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELAY_CI_APP_ID }}
          private-key: ${{ secrets.RELAY_CI_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - if: steps.tag.outputs.moved == 'true' && env.HAS_APP != 'true'
        run: echo "::warning::RELAY_CI_APP_ID or RELAY_CI_APP_KEY is not set; the release pull request's workflows won't start on their own"

      - name: Release pull request
        if: steps.tag.outputs.moved == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: ./scripts/release-pr.sh "$SHA" "$RUN_URL"
