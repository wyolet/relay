name: Publish image

# Builds and pushes the multi-arch relay images (lean + all-in-one) to BOTH
# ghcr.io/wyolet/relay and docker.io/wyolet/relay on every version tag (and on
# demand). The image bakes in the pinned admin UI + catalog (see Dockerfile).
#
# Required repo secrets:
#   DOCKERHUB_TOKEN   — Docker Hub access token (secret). The username is the
#                       repo VARIABLE DOCKERHUB_USERNAME (vars.*, not secret).
#
# The UI release asset is fetched from the now-public wyolet/relay-ui using the
# workflow's built-in GITHUB_TOKEN — no dedicated PAT. Companion artifact
# versions (UI_VERSION, CATALOG_REF) come from versions.env (the release BOM).
#
# First publish creates each package private; make them public (ghcr: org
# package settings; Docker Hub: repo settings) so users can pull without auth.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish (e.g. v0.1.0)'
        required: true
      ui_version:
        description: 'relay-ui release tag to embed (default: UI_VERSION from versions.env)'
        required: false
      catalog_ref:
        description: 'relay-catalog ref to seed (default: CATALOG_VERSION from versions.env)'
        required: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require secrets
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ] || { echo "::error::DOCKERHUB_USERNAME + DOCKERHUB_TOKEN secrets are required"; exit 1; }

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve versions
        id: v
        run: |
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"
          # Companion pins come from versions.env (the release BOM); explicit
          # workflow_dispatch inputs override.
          set -a; . ./versions.env; set +a
          UI="${{ github.event.inputs.ui_version }}";  [ -n "$UI" ]  || UI="$UI_VERSION"
          CAT="${{ github.event.inputs.catalog_ref }}"; [ -n "$CAT" ] || CAT="$CATALOG_VERSION"
          [ -n "$UI" ]  || { echo "::error::could not resolve UI_VERSION from versions.env"; exit 1; }
          [ -n "$CAT" ] || { echo "::error::could not resolve CATALOG_VERSION from versions.env"; exit 1; }
          echo "ui_version=$UI"   >> "$GITHUB_OUTPUT"
          echo "catalog_ref=$CAT" >> "$GITHUB_OUTPUT"

      - name: Build and push lean + standalone (multi-arch, both registries)
        env:
          VERSION: ${{ steps.v.outputs.version }}
          GIT_REVISION: ${{ github.sha }}
          UI_VERSION: ${{ steps.v.outputs.ui_version }}
          CATALOG_REF: ${{ steps.v.outputs.catalog_ref }}
        run: |
          # Args, dual-registry tags, and no-cache-filter (force a fresh
          # asset fetch) are all declared in docker-bake.hcl.
          # `release` = the prod + standalone bake group (same set `make
          # release` publishes locally).
          docker buildx bake -f docker-bake.hcl --push release
