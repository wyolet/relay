name: Release

# A v*.*.* tag on main is the release: pushes the relay images (lean +
# standalone) to BOTH ghcr.io/wyolet/relay and docker.io/wyolet/relay, the Helm
# chart to oci://ghcr.io/wyolet/charts, and creates the GitHub release. The
# image bakes in the pinned admin UI + catalog from versions.env (see Dockerfile).
#
# Images build in parallel with the test gate, without pushing; the result stays in the builder's cache. The build job scans each image with trivy and fails on fixable HIGH/CRITICAL vulnerabilities; its CycloneDX SBOMs are attached to the GitHub release. The push job attests signed provenance and the SBOM for each pushed image (`gh attestation verify`, see SECURITY.md). Only after both pass does the push job re-run the same bake with --push, which resolves from that cache. A test failure cancels the run, so nothing is pushed.
#
# CI_POOL=cluster runs the jobs on the self-hosted pools, where the image build uses a shared remote BuildKit; otherwise they run GitHub-hosted with a local builder, and the push job rebuilds from scratch. Published bake targets skip the Dockerfile's Go cache mounts (GO_CACHE_MOUNTS=0), since other clients of a shared BuildKit can write them; the layer cache is still shared, so the BuildKit endpoint should accept only trusted clients.
#
# Manual runs (workflow_dispatch) default to dry_run: tests + the no-push build
# + the cached re-bake, with every push/publish step skipped. dry_run=false is
# only accepted on a v*.*.* tag ref on main. A dry run reads no release secrets.
#
# Repo settings:
#   Environment `release` (deployments from v*.*.* tags only) holds
#   DOCKERHUB_TOKEN (secret) + DOCKERHUB_USERNAME (variable) — required to publish.
#   RELEASE_TELEGRAM_TOKEN (secret) + RELEASE_TELEGRAM_CHAT (variable) —
#   optional failure notification; skipped when unset.
#
# First publish creates each package private; make them public (ghcr: org
# package settings; Docker Hub: repo settings) so users can pull without auth.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test without pushing images, chart, or release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}
  BUILDKIT_ENDPOINT: tcp://buildkit.buildkit.svc.cluster.local:1234

jobs:
  guard:
    runs-on: ${{ vars.CI_POOL == 'cluster' && 'relay-ci' || 'ubuntu-latest' }}
    outputs:
      cluster: ${{ vars.CI_POOL == 'cluster' }}
      publish: ${{ steps.v.outputs.publish }}
      version: ${{ steps.v.outputs.version }}
      ui_version: ${{ steps.v.outputs.ui_version }}
      catalog_ref: ${{ steps.v.outputs.catalog_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A tag on an unmerged commit would publish unreviewed code.
      - name: Resolve publish mode and versions
        id: v
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          publish=false
          if [ "$GITHUB_EVENT_NAME" = push ] || [ "$DRY_RUN" = false ]; then publish=true; fi
          if [ "$publish" = true ]; then
            [[ "$GITHUB_REF_TYPE" = tag && "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]] \
              || { echo "::error::publishing requires a v*.*.* tag ref, got $TAG"; exit 1; }
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
              || { echo "::error::$TAG ($GITHUB_SHA) is not on origin/main"; exit 1; }
            version="${TAG#v}"
          else
            version="0.0.0-dryrun.${GITHUB_SHA::7}"
          fi
          set -a; . ./versions.env; set +a
          [ -n "$UI_VERSION" ]      || { echo "::error::could not resolve UI_VERSION from versions.env"; exit 1; }
          [ -n "$CATALOG_VERSION" ] || { echo "::error::could not resolve CATALOG_VERSION from versions.env"; exit 1; }
          {
            echo "publish=$publish"
            echo "version=$version"
            echo "ui_version=$UI_VERSION"
            echo "catalog_ref=$CATALOG_VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "publish=$publish version=$version"

  test:
    needs: guard
    runs-on: ${{ needs.guard.outputs.cluster == 'true' && 'relay-ci' || 'ubuntu-latest' }}
    permissions:
      contents: read
      actions: write
    # The cluster pool shares its Go cache with pull-request jobs; a release never reuses a cached test result.
    env:
      GOFLAGS: -count=1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        if: runner.environment == 'github-hosted'
        with:
          go-version: '1.26'
          cache: true

      - uses: azure/setup-helm@v5
        if: runner.environment == 'github-hosted'

      # make check runs golangci-lint; same pinned version as ci.yml.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          install-only: true
          skip-cache: ${{ runner.environment == 'self-hosted' }}

      - run: make check

      # Stops the parallel build; GitHub has no per-job cancel. curl, not gh: the cluster runner image has no gh.
      - name: Cancel run on test failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel"

  # An empty environment name means none: dry runs never enter `release`.
  build:
    needs: guard
    runs-on: ${{ needs.guard.outputs.cluster == 'true' && 'relay-release' || 'ubuntu-latest' }}
    environment: ${{ needs.guard.outputs.publish == 'true' && 'release' || '' }}
    # Trivy fetches only its vulnerability DB; no update check or telemetry.
    env:
      TRIVY_SKIP_VERSION_CHECK: 'true'
      TRIVY_DISABLE_TELEMETRY: 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Require secrets
        if: needs.guard.outputs.publish == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ] || { echo "::error::DOCKERHUB_USERNAME + DOCKERHUB_TOKEN secrets are required"; exit 1; }

      - uses: docker/setup-buildx-action@v4
        with:
          driver: ${{ runner.environment == 'self-hosted' && 'remote' || 'docker-container' }}
          endpoint: ${{ runner.environment == 'self-hosted' && env.BUILDKIT_ENDPOINT || '' }}

      - run: docker buildx inspect --bootstrap

      # Authenticated base-image pulls; nothing is pushed from this job.
      - name: Log in to Docker Hub
        if: needs.guard.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Exports OCI layouts for the scan; the result also stays in the builder's
      # cache for the push job, so the env must match the push job's bake exactly.
      - name: Build lean + standalone (no push)
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          GIT_REVISION: ${{ github.sha }}
          UI_VERSION: ${{ needs.guard.outputs.ui_version }}
          CATALOG_REF: ${{ needs.guard.outputs.catalog_ref }}
        run: |
          docker buildx bake -f docker-bake.hcl --allow "fs.write=$RUNNER_TEMP" --set '*.platform=linux/amd64' \
            --set "prod.output=type=oci,tar=false,dest=$RUNNER_TEMP/image/lean" \
            --set "standalone.output=type=oci,tar=false,dest=$RUNNER_TEMP/image/standalone" release

      - name: Install trivy
        run: |
          ./scripts/install-trivy.sh "$RUNNER_TEMP/trivy"
          echo "$RUNNER_TEMP/trivy" >> "$GITHUB_PATH"

      - name: Scan images and write SBOMs
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/sbom"
          for img in lean standalone; do
            trivy image --input "$RUNNER_TEMP/image/$img" --scanners vuln
            trivy image --input "$RUNNER_TEMP/image/$img" --skip-db-update --format cyclonedx \
              --output "$RUNNER_TEMP/sbom/relay-$VERSION-$img.cdx.json"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom/*.cdx.json
          if-no-files-found: error

      # Fails the build, so nothing is pushed; the full report is in the step above.
      - name: Fail on fixable HIGH/CRITICAL vulnerabilities
        run: |
          status=0
          for img in lean standalone; do
            trivy image --input "$RUNNER_TEMP/image/$img" --scanners vuln --severity HIGH,CRITICAL \
              --ignore-unfixed --skip-db-update --exit-code 1 || status=1
          done
          exit $status

  push:
    needs: [guard, test, build]
    runs-on: ${{ needs.guard.outputs.cluster == 'true' && 'relay-release' || 'ubuntu-latest' }}
    environment: ${{ needs.guard.outputs.publish == 'true' && 'release' || '' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4
        with:
          driver: ${{ runner.environment == 'self-hosted' && 'remote' || 'docker-container' }}
          endpoint: ${{ runner.environment == 'self-hosted' && env.BUILDKIT_ENDPOINT || '' }}

      - run: docker buildx inspect --bootstrap

      # Registry auth stays on the runner; buildx forwards it to buildkitd per session.
      - name: Log in to GitHub Container Registry
        if: needs.guard.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: needs.guard.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Same bake as the build job, so every step but the always-refetched
      # assets stage resolves from cache and this only exports + uploads.
      - name: Push lean + standalone (both registries)
        id: bake
        if: needs.guard.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          GIT_REVISION: ${{ github.sha }}
          UI_VERSION: ${{ needs.guard.outputs.ui_version }}
          CATALOG_REF: ${{ needs.guard.outputs.catalog_ref }}
        run: |
          meta="$RUNNER_TEMP/bake-metadata.json"
          docker buildx bake -f docker-bake.hcl --push --provenance=mode=max --metadata-file "$meta" \
            --set '*.platform=linux/amd64' release
          echo "lean=$(jq -r '.prod."containerimage.digest"' "$meta")" >> "$GITHUB_OUTPUT"
          echo "standalone=$(jq -r '.standalone."containerimage.digest"' "$meta")" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        if: needs.guard.outputs.publish == 'true'
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom

      # Signed SLSA provenance and the SBOM for each image digest, stored on
      # GitHub and pushed to ghcr; Docker Hub carries the same digests.
      - name: Attest lean provenance
        if: needs.guard.outputs.publish == 'true'
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/wyolet/relay
          subject-digest: ${{ steps.bake.outputs.lean }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest standalone provenance
        if: needs.guard.outputs.publish == 'true'
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/wyolet/relay
          subject-digest: ${{ steps.bake.outputs.standalone }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest lean SBOM
        if: needs.guard.outputs.publish == 'true'
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/wyolet/relay
          subject-digest: ${{ steps.bake.outputs.lean }}
          sbom-path: ${{ runner.temp }}/sbom/relay-${{ needs.guard.outputs.version }}-lean.cdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest standalone SBOM
        if: needs.guard.outputs.publish == 'true'
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/wyolet/relay
          subject-digest: ${{ steps.bake.outputs.standalone }}
          sbom-path: ${{ runner.temp }}/sbom/relay-${{ needs.guard.outputs.version }}-standalone.cdx.json
          push-to-registry: true
          create-storage-record: false

      # Provenance for the SBOM files attached to the GitHub release.
      - name: Attest SBOM files
        if: needs.guard.outputs.publish == 'true'
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/sbom/*.cdx.json

      # Dry run: the same re-bake without --push, to show the cache resolves.
      - name: Re-bake from cache (dry run, no push)
        if: needs.guard.outputs.publish != 'true'
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          GIT_REVISION: ${{ github.sha }}
          UI_VERSION: ${{ needs.guard.outputs.ui_version }}
          CATALOG_REF: ${{ needs.guard.outputs.catalog_ref }}
        run: docker buildx bake -f docker-bake.hcl --set '*.platform=linux/amd64' --set '*.output=type=cacheonly' release

  publish:
    needs: [guard, push]
    if: needs.guard.outputs.publish == 'true'
    runs-on: ${{ needs.guard.outputs.cluster == 'true' && 'relay-release' || 'ubuntu-latest' }}
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        if: runner.environment == 'github-hosted'

      # Chart version and appVersion both equal the image tag (tag without v),
      # so the chart version pins the image.
      - name: Push chart
        run: |
          VERSION="${TAG#v}"
          helm package chart --version "$VERSION" --app-version "$VERSION"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "relay-${VERSION}.tgz" oci://ghcr.io/wyolet/charts

      - uses: actions/download-artifact@v8
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom

      # Creation and each SBOM upload are skipped when already done, so a re-run
      # is safe. The tag exists: guard only publishes from a tag ref.
      - name: Create GitHub release and attach SBOMs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          release="$RUNNER_TEMP/release.json"
          code=$(curl -sS -o "$release" -w '%{http_code}' "${auth[@]}" "$api/tags/$TAG")
          if [ "$code" = 404 ]; then
            jq -n --arg tag "$TAG" '{tag_name: $tag, generate_release_notes: true}' \
              | curl -fsS -X POST "${auth[@]}" "$api" --data @- -o "$release"
          elif [ "$code" != 200 ]; then
            echo "::error::release lookup for $TAG returned HTTP $code"; exit 1
          fi
          upload_url=$(jq -r '.upload_url | sub("\\{.*"; "")' "$release")
          attached=$(jq -r '.assets[].name' "$release")
          for f in "$RUNNER_TEMP"/sbom/*.cdx.json; do
            name=$(basename "$f")
            grep -qxF "$name" <<<"$attached" && continue
            curl -fsS -X POST "${auth[@]}" -H 'Content-Type: application/json' \
              --data-binary "@$f" "$upload_url?name=$name" >/dev/null
          done

  # A test failure cancels the run, so cancelled() counts as a failed release.
  notify:
    needs: [guard, test, build, push, publish]
    if: (failure() || cancelled()) && !inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - name: Notify failure
        env:
          TELEGRAM_TOKEN: ${{ secrets.RELEASE_TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ vars.RELEASE_TELEGRAM_CHAT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT" ] || exit 0
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT}" \
            --data-urlencode "parse_mode=Markdown" \
            --data-urlencode "text=🛠 *Build failed* · relay \`${TAG}\`
          🔎 [workflow run](${RUN_URL})"
