name: Release

# A v*.*.* tag on main is the release: pushes the relay images (lean +
# standalone) to BOTH ghcr.io/wyolet/relay and docker.io/wyolet/relay, the Helm
# chart to oci://ghcr.io/wyolet/charts, and creates the GitHub release. The
# image bakes in the pinned admin UI + catalog from versions.env (see Dockerfile).
#
# Images build on a remote BuildKit pod in parallel with the test gate, without
# pushing; the result stays in the pod's persistent cache. Only after both pass
# does the push job re-run the same bake with --push, which resolves from that
# cache. A test failure cancels the run, so nothing is pushed.
#
# Manual runs (workflow_dispatch) default to dry_run: tests + the no-push build
# + the cached re-bake, with every push/publish step skipped. dry_run=false is
# only accepted on a v*.*.* tag ref on main.
#
# Repo settings:
#   DOCKERHUB_TOKEN (secret) + DOCKERHUB_USERNAME (variable) — required.
#   CI_KUBECONFIG (secret) — required; may exec into the BuildKit pod and
#   annotate the ArgoCD applications listed in ARGOCD_APPS.
#   RELEASE_TELEGRAM_TOKEN (secret) + RELEASE_TELEGRAM_CHAT (variable) —
#   optional failure notification; skipped when unset.
#
# First publish creates each package private; make them public (ghcr: org
# package settings; Docker Hub: repo settings) so users can pull without auth.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test without pushing images, chart, or release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}
  BUILDKIT_ENDPOINT: kube-pod://buildkit-0?namespace=buildkit
  ARGOCD_APPS: relay relay-saas

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.v.outputs.publish }}
      version: ${{ steps.v.outputs.version }}
      ui_version: ${{ steps.v.outputs.ui_version }}
      catalog_ref: ${{ steps.v.outputs.catalog_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A tag on an unmerged commit would publish unreviewed code.
      - name: Resolve publish mode and versions
        id: v
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          publish=false
          if [ "$GITHUB_EVENT_NAME" = push ] || [ "$DRY_RUN" = false ]; then publish=true; fi
          if [ "$publish" = true ]; then
            [[ "$GITHUB_REF_TYPE" = tag && "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]] \
              || { echo "::error::publishing requires a v*.*.* tag ref, got $TAG"; exit 1; }
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
              || { echo "::error::$TAG ($GITHUB_SHA) is not on origin/main"; exit 1; }
            version="${TAG#v}"
          else
            version="0.0.0-dryrun.${GITHUB_SHA::7}"
          fi
          set -a; . ./versions.env; set +a
          [ -n "$UI_VERSION" ]      || { echo "::error::could not resolve UI_VERSION from versions.env"; exit 1; }
          [ -n "$CATALOG_VERSION" ] || { echo "::error::could not resolve CATALOG_VERSION from versions.env"; exit 1; }
          {
            echo "publish=$publish"
            echo "version=$version"
            echo "ui_version=$UI_VERSION"
            echo "catalog_ref=$CATALOG_VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "publish=$publish version=$version"

  test:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - uses: azure/setup-helm@v4

      # make check runs golangci-lint; same pinned version as ci.yml.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          install-only: true

      - run: make check

      # Stops the parallel build; GitHub has no per-job cancel.
      - name: Cancel run on test failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"

  build:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require secrets
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          CI_KUBECONFIG: ${{ secrets.CI_KUBECONFIG }}
        run: |
          [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ] || { echo "::error::DOCKERHUB_USERNAME + DOCKERHUB_TOKEN secrets are required"; exit 1; }
          [ -n "$CI_KUBECONFIG" ] || { echo "::error::CI_KUBECONFIG secret is required"; exit 1; }

      - name: Write kubeconfig
        env:
          CI_KUBECONFIG: ${{ secrets.CI_KUBECONFIG }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/kubeconfig"
          printf '%s\n' "$CI_KUBECONFIG" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: ${{ env.BUILDKIT_ENDPOINT }}

      - run: docker buildx inspect --bootstrap

      # Authenticated base-image pulls; nothing is pushed from this job.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # cacheonly keeps the result in the BuildKit pod's persistent cache for
      # the push job; the env must match the push job's bake exactly.
      - name: Build lean + standalone (no push)
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          GIT_REVISION: ${{ github.sha }}
          UI_VERSION: ${{ needs.guard.outputs.ui_version }}
          CATALOG_REF: ${{ needs.guard.outputs.catalog_ref }}
        run: docker buildx bake -f docker-bake.hcl --set '*.platform=linux/amd64' --set '*.output=type=cacheonly' release

  push:
    needs: [guard, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Write kubeconfig
        env:
          CI_KUBECONFIG: ${{ secrets.CI_KUBECONFIG }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/kubeconfig"
          printf '%s\n' "$CI_KUBECONFIG" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: ${{ env.BUILDKIT_ENDPOINT }}

      - run: docker buildx inspect --bootstrap

      # Registry auth stays on the runner; buildx forwards it to buildkitd per session.
      - name: Log in to GitHub Container Registry
        if: needs.guard.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Same bake as the build job, so every step but the always-refetched
      # assets stage resolves from cache and this only exports + uploads.
      - name: Push lean + standalone (both registries)
        if: needs.guard.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          GIT_REVISION: ${{ github.sha }}
          UI_VERSION: ${{ needs.guard.outputs.ui_version }}
          CATALOG_REF: ${{ needs.guard.outputs.catalog_ref }}
        run: docker buildx bake -f docker-bake.hcl --push --set '*.platform=linux/amd64' release

      # Dry run: the same re-bake without --push, to show the cache resolves.
      - name: Re-bake from cache (dry run, no push)
        if: needs.guard.outputs.publish != 'true'
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          GIT_REVISION: ${{ github.sha }}
          UI_VERSION: ${{ needs.guard.outputs.ui_version }}
          CATALOG_REF: ${{ needs.guard.outputs.catalog_ref }}
        run: docker buildx bake -f docker-bake.hcl --set '*.platform=linux/amd64' --set '*.output=type=cacheonly' release

  publish:
    needs: [guard, push]
    if: needs.guard.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      # Chart version and appVersion both equal the image tag (tag without v),
      # so the chart version pins the image.
      - name: Push chart
        run: |
          VERSION="${TAG#v}"
          helm package chart --version "$VERSION" --app-version "$VERSION"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "relay-${VERSION}.tgz" oci://ghcr.io/wyolet/charts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --generate-notes

      # Deploy now instead of waiting for ArgoCD's poll interval.
      - name: Refresh ArgoCD applications
        env:
          CI_KUBECONFIG: ${{ secrets.CI_KUBECONFIG }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/kubeconfig"
          printf '%s\n' "$CI_KUBECONFIG" > "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          read -ra apps <<< "$ARGOCD_APPS"
          kubectl -n argocd annotate application "${apps[@]}" argocd.argoproj.io/refresh=normal --overwrite

  # A test failure cancels the run, so cancelled() counts as a failed release.
  notify:
    needs: [guard, test, build, push, publish]
    if: (failure() || cancelled()) && !inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - name: Notify failure
        env:
          TELEGRAM_TOKEN: ${{ secrets.RELEASE_TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ vars.RELEASE_TELEGRAM_CHAT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT" ] || exit 0
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT}" \
            --data-urlencode "parse_mode=Markdown" \
            --data-urlencode "text=🛠 *Build failed* · relay \`${TAG}\`
          🔎 [workflow run](${RUN_URL})"
