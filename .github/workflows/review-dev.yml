name: Review dev

# A daily read-only review of the code that changed on dev since the ai-reviewed tag. One review
# per area (scripts/review-units.sh), one approach review per pull request, one pass over the
# interactions between areas. The reviewer (scripts/review-run.sh) only returns findings as JSON:
# it gets the checkout and no GitHub token. The report job files the issues and moves the tag
# when every unit completed (scripts/review-report.sh). The schedule only dispatches this
# workflow on dev, so a review runs in dev's context rather than main's.
#
# Configuration: AI_REVIEW_RELAY_KEY (secret) and AI_REVIEW_BASE_URL (variable) reach the model
# through relay; AI_REVIEW_MODEL (areas, approach) and AI_REVIEW_CROSS_MODEL (cross pass) pick the
# models; AI_REVIEW_MAX_PARALLEL caps the concurrent reviews. Without the key the run plans,
# reports that, and opens nothing.

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      from:
        description: Start of the range (default the ai-reviewed tag, else the latest release)
        required: false
      to:
        description: End of the range (default the head of the dispatched branch)
        required: false
      dry_run:
        description: Print the issues and the tag move instead of making them
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: review-dev
  cancel-in-progress: false

env:
  CLAUDE_CODE_VERSION: 2.1.302

jobs:
  dispatch:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run review-dev.yml --repo "$GITHUB_REPOSITORY" --ref dev

  plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.p.outputs.run }}
      units: ${{ steps.p.outputs.units }}
      has_key: ${{ steps.p.outputs.has_key }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.to || github.sha }}
          fetch-depth: 0

      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
          FROM: ${{ inputs.from }}
          HAS_KEY: ${{ secrets.AI_REVIEW_RELAY_KEY != '' }}
        run: |
          to=$(git rev-parse HEAD)
          from=$FROM
          [ -n "$from" ] || from=$(git rev-parse -q --verify "refs/tags/ai-reviewed^{commit}" || true)
          [ -n "$from" ] || from=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          from=$(git rev-parse "${from}^{commit}")
          echo "has_key=$HAS_KEY" >> "$GITHUB_OUTPUT"
          if [ "$from" = "$to" ]; then
            echo "::notice::dev ${to::12} is already reviewed"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          mkdir -p "$RUNNER_TEMP/review"
          scripts/review-units.sh "$from" "$to" > "$RUNNER_TEMP/review/units.json"
          for n in $(jq -r '.prs[].pr' "$RUNNER_TEMP/review/units.json"); do
            gh pr view "$n" --repo "$GITHUB_REPOSITORY" --json number,title,body --jq '{pr: .number, title, body}'
          done | jq -s . > "$RUNNER_TEMP/review/prs.json"
          units=$(jq -c '[(.areas[] | {kind: "area", id}), (.prs[] | {kind: "approach", id})]' "$RUNNER_TEMP/review/units.json")
          echo "units=$units" >> "$GITHUB_OUTPUT"
          echo "run=$([ "$units" != "[]" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          {
            echo "Range ${from::12}..${to::12}"
            jq -r '"\(.areas | length) area units, \(.prs | length) approach units"' "$RUNNER_TEMP/review/units.json"
            [ "$HAS_KEY" = true ] || echo "AI_REVIEW_RELAY_KEY is not set: nothing is reviewed."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: steps.p.outputs.run == 'true'
        with:
          name: review-context
          path: ${{ runner.temp }}/review/

  review:
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.has_key == 'true'
    runs-on: ${{ vars.CI_POOL == 'cluster' && 'relay-ci' || 'ubuntu-latest' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(vars.AI_REVIEW_MAX_PARALLEL || '4') }}
      matrix:
        unit: ${{ fromJSON(needs.plan.outputs.units) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.to || github.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: review-context
          path: ${{ runner.temp }}/review

      # The cluster runner image has no Node, which Claude Code needs.
      - uses: actions/setup-node@v5
        if: runner.environment == 'self-hosted'
        with:
          node-version: '24'

      - name: Install Claude Code
        run: npm install -g --no-fund --no-audit "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"

      - name: Review ${{ matrix.unit.kind }} ${{ matrix.unit.id }}
        env:
          ANTHROPIC_BASE_URL: ${{ vars.AI_REVIEW_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.AI_REVIEW_RELAY_KEY }}
          REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL || 'claude-opus-5-5' }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ vars.AI_REVIEW_MODEL || 'claude-opus-5-5' }}
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: '16000'
          CLAUDE_CODE_MAX_RETRIES: '3'
          API_TIMEOUT_MS: '300000'
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
          DISABLE_TELEMETRY: '1'
          DISABLE_ERROR_REPORTING: '1'
          KIND: ${{ matrix.unit.kind }}
          ID: ${{ matrix.unit.id }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          scripts/review-run.sh "$RUNNER_TEMP/review" "$KIND" "$ID" "$RUNNER_TEMP/out/$ID.json"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: review-result-${{ matrix.unit.id }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: ignore

  cross:
    needs: [plan, review]
    if: always() && needs.plan.outputs.run == 'true' && needs.plan.outputs.has_key == 'true'
    runs-on: ${{ vars.CI_POOL == 'cluster' && 'relay-ci' || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.to || github.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: review-context
          path: ${{ runner.temp }}/review

      - uses: actions/download-artifact@v8
        with:
          pattern: review-result-*
          merge-multiple: true
          path: ${{ runner.temp }}/review/results

      - uses: actions/setup-node@v5
        if: runner.environment == 'self-hosted'
        with:
          node-version: '24'

      - name: Install Claude Code
        run: npm install -g --no-fund --no-audit "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"

      - name: Review interactions
        env:
          ANTHROPIC_BASE_URL: ${{ vars.AI_REVIEW_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.AI_REVIEW_RELAY_KEY }}
          REVIEW_MODEL: ${{ vars.AI_REVIEW_CROSS_MODEL || 'claude-opus-5-5' }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ vars.AI_REVIEW_CROSS_MODEL || 'claude-opus-5-5' }}
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: '16000'
          CLAUDE_CODE_MAX_RETRIES: '3'
          API_TIMEOUT_MS: '300000'
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
          DISABLE_TELEMETRY: '1'
          DISABLE_ERROR_REPORTING: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          scripts/review-run.sh "$RUNNER_TEMP/review" cross cross "$RUNNER_TEMP/out/cross.json"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: review-result-cross
          path: ${{ runner.temp }}/out/
          if-no-files-found: ignore

  report:
    needs: [plan, review, cross]
    if: always() && needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: review-context
          path: ${{ runner.temp }}/review

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: review-result-*
          merge-multiple: true
          path: ${{ runner.temp }}/review/results

      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/review/results"
          scripts/review-report.sh "$RUNNER_TEMP/review" | tee -a "$GITHUB_STEP_SUMMARY"
