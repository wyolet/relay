name: Fix red dev

# Started by full.yml when the full CI run on dev fails, with the failing
# commit, the last commit whose full run passed, and the failed run. One
# attempt per failing commit. Claude reproduces the failure with the failing
# test only, bisects the range, and then either opens one small fix (or revert)
# PR labelled dev-fix, or opens an issue labelled needs-decision and stops.
# It never merges. A failure on a commit that came from a dev-fix PR goes to a
# human instead.
#
# full.yml dispatches this on dev, so it runs in dev's context. The model is
# reached through relay: DEV_FIXER_BASE_URL (variable) and a dedicated key in
# DEV_FIXER_RELAY_KEY (secret); DEV_FIXER_MODEL picks the model. Without the
# key, the run reports that and stops. Notifications go to Telegram when
# RELEASE_TELEGRAM_TOKEN (secret) and RELEASE_TELEGRAM_CHAT (variable) are set.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Failing commit
        required: true
      good:
        description: Last commit whose full run passed (empty if unknown)
        required: false
      run_id:
        description: The failed CI run
        required: true
      base:
        description: Branch the fix PR targets
        default: dev

permissions:
  contents: read

concurrency:
  group: fix-dev-${{ inputs.sha }}
  cancel-in-progress: false

env:
  CLAUDE_CODE_VERSION: 2.1.302
  GH_VERSION: 2.102.0
  SHA: ${{ inputs.sha }}
  GOOD: ${{ inputs.good }}
  RUN_ID: ${{ inputs.run_id }}
  BASE: ${{ inputs.base }}

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
    outputs:
      run: ${{ steps.g.outputs.run }}
      short: ${{ steps.g.outputs.short }}
      outcome: ${{ steps.g.outputs.outcome }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.DEV_FIXER_RELAY_KEY != '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ inputs.run_id }}
        run: |
          R="$GITHUB_REPOSITORY"
          short=${SHA::12}
          echo "short=$short" >> "$GITHUB_OUTPUT"
          skip() { echo "run=false" >> "$GITHUB_OUTPUT"; echo "outcome=$1" >> "$GITHUB_OUTPUT"; echo "$1"; exit 0; }

          for label in dev-fix:0e8a16 needs-decision:d93f0b; do
            gh label create "${label%%:*}" --repo "$R" --color "${label##*:}" --force >/dev/null
          done

          gh api "repos/$R/git/ref/heads/fix/dev-$short" >/dev/null 2>&1 \
            && skip "skipped: branch fix/dev-$short exists"
          n=$(gh pr list --repo "$R" --state open --label dev-fix --search "$short in:title" --json number --jq length)
          [ "$n" = 0 ] || skip "skipped: an open dev-fix PR names $short"
          n=$(gh issue list --repo "$R" --state open --label needs-decision --search "$short in:title" --json number --jq length)
          [ "$n" = 0 ] || skip "skipped: an open needs-decision issue names $short"

          # A fix that broke dev again is not retried by the fixer.
          labels=$(gh api "repos/$R/commits/$SHA/pulls" --jq '[.[].labels[].name] | join(",")')
          if [[ ",$labels," == *",dev-fix,"* ]]; then
            url=$(gh issue create --repo "$R" --label needs-decision \
              --title "dev $short: full CI failed on a dev-fix commit" \
              --body "The full CI run on \`$SHA\` failed ($RUN_URL), and that commit came from a dev-fix PR, so the fixer does not retry it. Last green: \`${GOOD:-unknown}\`.")
            skip "escalated: the failing commit came from a dev-fix PR; $url"
          fi

          [ "$HAS_KEY" = true ] || skip "skipped: DEV_FIXER_RELAY_KEY is not set"
          echo "run=true" >> "$GITHUB_OUTPUT"

  fix:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ${{ vars.CI_POOL == 'cluster' && 'relay-ci-integration' || 'ubuntu-latest' }}
    # Claude itself stops at 30 minutes, which leaves time to report the run.
    timeout-minutes: 40
    # No actions or workflows permission: Claude cannot start runs or change
    # .github/workflows, and the base branch's ruleset blocks direct pushes.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    # The cluster pool runs Postgres, Valkey and ClickHouse as pod sidecars on
    # the same addresses. An empty image skips a service.
    services:
      postgres:
        image: ${{ vars.CI_POOL != 'cluster' && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_DB: relay_test
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay -d relay_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
      valkey:
        image: ${{ vars.CI_POOL != 'cluster' && 'valkey/valkey:8-alpine' || '' }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
      clickhouse:
        image: ${{ vars.CI_POOL != 'cluster' && 'clickhouse/clickhouse-server:24.8-alpine' || '' }}
        env:
          CLICKHOUSE_USER: relay
          CLICKHOUSE_PASSWORD: relay
        ports:
          - 9000:9000
        options: >-
          --health-cmd "clickhouse-client --user relay --password relay --query 'SELECT 1'"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      RELAY_TEST_PG_DSN: postgres://relay:relay@127.0.0.1:5432/relay_test?sslmode=disable
      RELAY_TEST_REDIS_ADDR: 127.0.0.1:6379
      RELAY_TEST_CH_DSN: clickhouse://relay:relay@127.0.0.1:9000/default
      SHORT: ${{ needs.guard.outputs.short }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        if: runner.environment == 'github-hosted'
        with:
          go-version: '1.26'
          cache: true

      # For a failing lint or chart check; same pinned version as ci.yml.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-only: true
          skip-cache: ${{ runner.environment == 'self-hosted' }}

      - uses: azure/setup-helm@v5
        if: runner.environment == 'github-hosted'

      # The cluster runner image has neither Node (for Claude Code) nor gh.
      - uses: actions/setup-node@v5
        if: runner.environment == 'self-hosted'
        with:
          node-version: '24'

      - name: Install gh
        if: runner.environment == 'self-hosted'
        run: |
          base="https://github.com/cli/cli/releases/download/v$GH_VERSION"
          tgz="gh_${GH_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tgz" "$base/$tgz"
          curl -fsSL "$base/gh_${GH_VERSION}_checksums.txt" | grep " $tgz\$" | (cd "$RUNNER_TEMP" && sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64/bin" >> "$GITHUB_PATH"

      - name: Collect the failed jobs' logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git switch -c "fix/dev-$SHORT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed | tail -n 4000 > "$RUNNER_TEMP/failed.log"
          wc -l "$RUNNER_TEMP/failed.log"

      - name: Install Claude Code
        run: npm install -g --no-fund --no-audit "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"

      # Plain `claude -p` in bare mode: no MCP servers, hooks, plugins, CLAUDE.md
      # auto-discovery or settings from the checked-out branch, one model for
      # every call. Bash is unrestricted on this throwaway runner; the job
      # token's scope is the boundary, and the denies only encode policy.
      - name: Claude
        id: claude
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_BASE_URL: ${{ vars.DEV_FIXER_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.DEV_FIXER_RELAY_KEY }}
          MODEL: ${{ vars.DEV_FIXER_MODEL || 'claude-sonnet-5-5' }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ vars.DEV_FIXER_MODEL || 'claude-sonnet-5-5' }}
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: ${{ vars.DEV_FIXER_MAX_OUTPUT_TOKENS || '16000' }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
          DISABLE_TELEMETRY: '1'
          DISABLE_ERROR_REPORTING: '1'
          CLAUDE_CODE_DISABLE_TERMINAL_TITLE: '1'
          CLAUDE_CODE_ENABLE_PROMPT_SUGGESTION: 'false'
          CLAUDE_CODE_ENABLE_AWAY_SUMMARY: '0'
          CLAUDE_CODE_DISABLE_1M_CONTEXT: '1'
          CLAUDE_CODE_DISABLE_REFUSAL_FALLBACK: '1'
          CLAUDE_CODE_EFFORT_LEVEL: medium
          BASH_DEFAULT_TIMEOUT_MS: '600000'
          BASH_MAX_TIMEOUT_MS: '1200000'
          TARGET: ${{ inputs.base }}
          GOOD_SHA: ${{ inputs.good }}
          LOG: ${{ runner.temp }}/failed.log
          OUT: ${{ runner.temp }}/claude.jsonl
        run: |
          cat > "$RUNNER_TEMP/prompt.md" <<EOF
          The full CI run on \`$TARGET\` failed at commit $SHA. The last commit whose full run passed is \`$GOOD_SHA\` (empty means unknown: bisect from the commit before the failing one backwards, at most 20 commits). The failing jobs' logs are in $LOG.

          Read CLAUDE.md and .claude/ci.md first. You are on branch fix/dev-$SHORT, created at the failing commit.

          1. Reproduce. From the log, find the failing test or check and run only that, e.g. \`go test ./<pkg> -run '^<Test>$'\`; add \`-tags=integration\` for integration tests. Postgres, Valkey and ClickHouse are running; RELAY_TEST_PG_DSN, RELAY_TEST_REDIS_ADDR and RELAY_TEST_CH_DSN are set.
          2. Bisect the range with that test only (\`git bisect start <bad> <good>\`, \`git bisect run ...\`) to find the culprit commit, then \`git bisect reset\` and \`git switch fix/dev-$SHORT\`.
          3. Take exactly one outcome.

          (a) The right fix is small and focused, or is a clean \`git revert <culprit>\`. Commit it on the branch. Rerun the failing test or check, and \`go build ./...\` and \`go vet\` on the packages you touched; all must pass. Don't run the whole suite: the PR gets the full CI. Then \`git push origin fix/dev-$SHORT\` and open one PR: \`gh pr create --base $TARGET --label dev-fix\`, title \`<type>: <summary> (dev $SHORT)\` where type is fix or revert. The description names the culprit commit and the root cause and says what changed. Never loosen a test to make it pass: no skips, no raised tolerances, no deleted assertions. If you change a test file, the description explains why the test was wrong.

          (b) The fix is not small, touches the architecture or a design decision, or you could not reproduce or bisect. Open one issue: \`gh issue create --label needs-decision\`, title \`dev $SHORT: <summary>\`, with the failure, the culprit commit, the root cause and the options you see. Then stop: push nothing, open no PR, write no draft code.

          Change nothing under .github/ or .claude/ and never touch .env. Never merge anything.
          EOF
          timeout --signal=TERM 30m claude -p "$(cat "$RUNNER_TEMP/prompt.md")" \
            --bare --setting-sources user \
            --settings "{\"availableModels\":[\"$MODEL\"],\"enforceAvailableModels\":true}" \
            --model "$MODEL" \
            --tools "Bash,Read,Edit" \
            --allowedTools Bash Read Edit \
            --disallowedTools Agent TaskStop WebFetch WebSearch "mcp__*" \
              "Edit(.github/**)" "Edit(.claude/**)" \
              "Bash(gh pr merge *)" "Bash(gh workflow *)" "Bash(git push *--force*)" "Bash(git push * -f*)" \
            --strict-mcp-config --permission-mode dontAsk --permission-prompts none \
            --max-turns 80 --max-budget-usd 5 \
            --output-format stream-json --verbose --no-session-persistence > "$OUT"
          jq -e -s 'map(select(.type == "result")) | last | .is_error == false' "$OUT" >/dev/null

      - name: Report the run
        if: always() && steps.claude.outcome != 'skipped'
        env:
          OUT: ${{ runner.temp }}/claude.jsonl
        run: |
          [ -s "$OUT" ] || { echo "no output from claude"; exit 0; }
          jq -c 'select(.type == "system" and .subtype == "init") | {claude_code_version, model, tools, mcp_servers}' "$OUT"
          jq -s -r '[.[] | select(.type == "assistant") | .message.content[]? | select(.type == "text") | .text] | last // "no text"' "$OUT" | head -c 2000; echo
          jq -c 'select(.type == "result") | {subtype, is_error, num_turns, total_cost_usd}' "$OUT" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "permission denials:"
          jq -c 'select(.type == "result") | .permission_denials[]? | {tool_name, tool_input}' "$OUT" | head -20 | cut -c1-300
          echo "failed tool results:"
          jq -c 'select(.type == "user") | .message.content[]? | select(.type == "tool_result" and .is_error == true) | .content' "$OUT" | head -10 | cut -c1-300

  # A PR opened with the workflow token starts no CI; the full tier dispatched
  # on its branch puts the required checks on its head commit.
  verify:
    needs: [guard, fix]
    if: always() && needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: fix/dev-${{ needs.guard.outputs.short }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" >/dev/null 2>&1 || { echo "no $BRANCH pushed"; exit 0; }
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          echo "dispatched ci.yml on $BRANCH"

  notify:
    needs: [guard, fix, verify]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GUARD_OUTCOME: ${{ needs.guard.outputs.outcome }}
          SHORT: ${{ needs.guard.outputs.short }}
          FIX_RESULT: ${{ needs.fix.result }}
          TELEGRAM_TOKEN: ${{ secrets.RELEASE_TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ vars.RELEASE_TELEGRAM_CHAT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          R="$GITHUB_REPOSITORY"
          if [ -n "$GUARD_OUTCOME" ]; then
            outcome=$GUARD_OUTCOME
          elif pr=$(gh pr list --repo "$R" --state open --head "fix/dev-$SHORT" --json url --jq '.[0].url // empty') && [ -n "$pr" ]; then
            outcome="fix PR opened: $pr"
          elif issue=$(gh issue list --repo "$R" --state open --label needs-decision --search "$SHORT in:title" --json url --jq '.[0].url // empty') && [ -n "$issue" ]; then
            outcome="needs-decision issue opened: $issue"
          else
            outcome="no PR or issue (fixer $FIX_RESULT)"
          fi
          echo "$outcome" | tee -a "$GITHUB_STEP_SUMMARY"
          [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT" ] || exit 0
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT}" \
            --data-urlencode "text=relay dev ${SHORT:-${SHA::12}} red: ${outcome}
          ${RUN_URL}" >/dev/null
