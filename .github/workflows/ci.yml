name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Codebase rules (canonical-protocol 1/2/4/10)
        run: make lint-rules

      - name: Vet
        run: |
          for mod in . sdk jobq; do
            (cd "$mod" && go vet ./... && go vet -tags=integration ./...)
          done

      - name: Build
        run: |
          go build ./...
          (cd sdk && go build ./...)
          (cd jobq && go build ./...)

      # Every module's unit tests, under -race.
      - name: Test
        run: make test-race

      - name: Fuzz
        run: make test-fuzz FUZZ_TIME=20s

      - name: Allocation gate
        run: make bench-gate

  # Integration-tagged tests against a Postgres service. Each test creates a
  # database of its own from a migrated template, so packages run in parallel.
  # The Redis tests start their own containers through the runner's Docker.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: relay_test
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay -d relay_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      RELAY_TEST_PG_DSN: postgres://relay:relay@127.0.0.1:5432/relay_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Integration tests
        run: make test-integration-run

      - uses: actions/upload-artifact@v4
        with:
          name: integration-coverage
          path: .cover/*.out
          if-no-files-found: error

  # Merges the unit profiles of every module with the integration profiles:
  # store packages only get credit from the integration run.
  coverage:
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Unit profiles
        run: make test-cover

      - uses: actions/download-artifact@v4
        with:
          name: integration-coverage
          path: .cover

      - name: Coverage tiers
        run: make cover-check COVER_ENFORCE=1

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: helm lint chart
