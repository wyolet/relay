name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  # Decides which jobs a pull request needs. Gating jobs with `if:` rather than
  # workflow-level `paths` keeps every check reporting (skipped counts as
  # success). Pushes to main run everything; the weekly schedule runs only the
  # security scans, to surface new advisories. Paths not named below count as Go.
  # `cluster` picks the self-hosted pools: only when the CI_POOL variable says
  # so, and never for pull requests from forks (or deleted head repos).
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      cluster: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_POOL == 'cluster' }}
      go: ${{ github.event_name == 'push' || steps.filter.outputs.go == 'true' }}
      chart: ${{ github.event_name == 'push' || steps.filter.outputs.chart == 'true' }}
      boot: ${{ github.event_name == 'push' || steps.filter.outputs.boot == 'true' }}
      scan: ${{ github.event_name != 'pull_request' || steps.filter.outputs.go == 'true' || steps.filter.outputs.chart == 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            go:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!chart/**'
              - '!versions.env'
            chart:
              - 'chart/**'
              - '.github/workflows/**'
            boot:
              - 'versions.env'
              - 'scripts/boot-smoke.sh'
              - '.github/workflows/**'

  # golangci-lint runs govet (integration tag included), so there is no
  # separate vet step.
  lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ needs.changes.outputs.cluster == 'true' && 'relay-ci' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        if: runner.environment == 'github-hosted'
        with:
          go-version: '1.26'
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Codebase rules (canonical-protocol 1/2/4/10)
        run: make lint-rules

      # Installs the pinned binary and, on GitHub-hosted runners, restores its
      # analysis cache (self-hosted runners keep it on a volume); make lint
      # runs it over every module.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-only: true
          skip-cache: ${{ runner.environment == 'self-hosted' }}

      - name: golangci-lint
        run: make lint

      - name: Build
        run: |
          go build ./...
          (cd sdk && go build ./...)
          (cd jobq && go build ./...)

  # Every module's unit tests, once: under -race and writing the unit
  # coverprofiles the coverage job merges.
  test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ needs.changes.outputs.cluster == 'true' && 'relay-ci' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        if: runner.environment == 'github-hosted'
        with:
          go-version: '1.26'
          cache: true

      - name: Test
        run: make test-race-cover

      - uses: actions/upload-artifact@v7
        with:
          name: unit-coverage
          path: .cover/*.out
          include-hidden-files: true
          if-no-files-found: error

  fuzz:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ needs.changes.outputs.cluster == 'true' && 'relay-ci' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        if: runner.environment == 'github-hosted'
        with:
          go-version: '1.26'
          cache: true

      - name: Fuzz
        run: make test-fuzz

  bench:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ needs.changes.outputs.cluster == 'true' && 'relay-ci' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        if: runner.environment == 'github-hosted'
        with:
          go-version: '1.26'
          cache: true

      - name: Allocation gate
        run: make bench-gate

  govulncheck:
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'schedule'
    runs-on: ${{ needs.changes.outputs.cluster == 'true' && 'relay-ci' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        if: runner.environment == 'github-hosted'
        with:
          go-version: '1.26'
          cache: true

      - name: govulncheck
        run: make vulncheck

  # Dependency vulnerabilities, misconfigurations (Dockerfile, chart rendered
  # with default values) and committed secrets. Every finding goes to code
  # scanning; only fixable HIGH/CRITICAL vulnerabilities and secrets fail the
  # job, since misconfiguration checks need per-finding triage.
  trivy:
    needs: changes
    if: needs.changes.outputs.scan == 'true'
    runs-on: ${{ needs.changes.outputs.cluster == 'true' && 'relay-ci' || 'ubuntu-latest' }}
    permissions:
      contents: read
      security-events: write
    # Only the vulnerability DB and checks bundle are fetched; no update check or telemetry.
    env:
      TRIVY_SKIP_VERSION_CHECK: 'true'
      TRIVY_DISABLE_TELEMETRY: 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Install trivy
        run: |
          ./scripts/install-trivy.sh "$RUNNER_TEMP/trivy"
          echo "$RUNNER_TEMP/trivy" >> "$GITHUB_PATH"

      - name: Scan
        run: |
          trivy fs --scanners vuln,misconfig,secret --helm-set secrets.existingSecret=relay \
            --format json --output "$RUNNER_TEMP/trivy.json" .
          trivy convert --scanners vuln,misconfig,secret --format table "$RUNNER_TEMP/trivy.json"
          trivy convert --format sarif --output "$RUNNER_TEMP/trivy.sarif" "$RUNNER_TEMP/trivy.json"

      # A fork's token cannot write security events.
      - uses: github/codeql-action/upload-sarif@v4
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          sarif_file: ${{ runner.temp }}/trivy.sarif
          category: trivy-fs

      - name: Fail on fixable HIGH/CRITICAL vulnerabilities and secrets
        run: |
          trivy fs --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed \
            --skip-db-update --exit-code 1 .

  # Integration-tagged tests against Postgres and Valkey services. Each test
  # gets a database of its own on both, so packages run in parallel.
  integration:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ needs.changes.outputs.cluster == 'true' && 'relay-ci-integration' || 'ubuntu-latest' }}
    # The cluster pool runs Postgres and Valkey as pod sidecars on the same
    # addresses. An empty image skips a service ('' is falsy, hence the order).
    services:
      postgres:
        image: ${{ needs.changes.outputs.cluster != 'true' && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_DB: relay_test
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay -d relay_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
      valkey:
        image: ${{ needs.changes.outputs.cluster != 'true' && 'valkey/valkey:8-alpine' || '' }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      RELAY_TEST_PG_DSN: postgres://relay:relay@127.0.0.1:5432/relay_test?sslmode=disable
      RELAY_TEST_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        if: runner.environment == 'github-hosted'
        with:
          go-version: '1.26'
          cache: true

      - name: Integration tests
        run: make test-integration-run

      - uses: actions/upload-artifact@v7
        with:
          name: integration-coverage
          path: .cover/*.out
          include-hidden-files: true
          if-no-files-found: error

  # Merges the unit profiles of every module with the integration profiles:
  # store packages only get credit from the integration run.
  coverage:
    runs-on: ${{ needs.changes.outputs.cluster == 'true' && 'relay-ci' || 'ubuntu-latest' }}
    needs: [changes, test, integration]
    if: needs.changes.outputs.go == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: '*-coverage'
          merge-multiple: true
          path: .cover

      - name: Coverage tiers
        run: make cover-check COVER_ENFORCE=1

  chart:
    needs: changes
    if: needs.changes.outputs.chart == 'true'
    runs-on: ${{ needs.changes.outputs.cluster == 'true' && 'relay-ci' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        if: runner.environment == 'github-hosted'
      - name: helm lint
        run: helm lint chart

  # Builds and boots relay with the UI and catalog versions.env pins, against
  # an empty Postgres: a bump naming a missing or broken release fails here.
  # GitHub-hosted only: it needs a Postgres service container.
  boot:
    needs: changes
    if: needs.changes.outputs.boot == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: relay
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay -d relay"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      RELAY_PG_DSN: postgres://relay:relay@127.0.0.1:5432/relay?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Boot smoke
        run: ./scripts/boot-smoke.sh
