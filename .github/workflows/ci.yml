name: CI

on:
  push:
    branches: [main]
  # `closed` only cancels the pull request's in-progress run; it runs no job.
  pull_request:
    types: [opened, synchronize, reopened, closed]
  schedule:
    - cron: '17 5 * * 1'
  # The full tier on any branch; full.yml dispatches it on dev.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request, or its merge or close, cancels the run in
# progress. Every other run gets a group of its own, so pushes to main and
# dispatched full runs are never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which jobs a pull request needs. Gating jobs with `if:` rather than
  # workflow-level `paths` keeps every check reporting (skipped counts as
  # success). Pushes to main and manual runs get every job; the weekly
  # schedule runs only the security scans, to surface new advisories. Paths not
  # named below count as Go.
  # `full` is the release tier: every event but a pull request into a branch
  # other than main. Those get the single `dev` job instead: lint, build and
  # plain unit tests, plus integration when they touch the paths it covers.
  # `cluster` picks the self-hosted pools: only when the CI_POOL variable says
  # so, and never for pull requests from forks (or deleted head repos).
  # release/next only ever points at a dev commit whose full run passed, and
  # required checks match by commit, so its pull request into main runs nothing.
  changes:
    if: github.event.action != 'closed' && github.head_ref != 'release/next'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      cluster: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_POOL == 'cluster' }}
      full: ${{ github.event_name != 'pull_request' || github.base_ref == 'main' }}
      go: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.go == 'true' }}
      chart: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.chart == 'true' }}
      boot: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.boot == 'true' }}
      integration: ${{ steps.filter.outputs.integration == 'true' }}
      clickhouse: ${{ steps.filter.outputs.clickhouse == 'true' }}
      scan: ${{ github.event_name != 'pull_request' || steps.filter.outputs.go == 'true' || steps.filter.outputs.chart == 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            go:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!chart/**'
              - '!versions.env'
            chart:
              - 'chart/**'
              - '.github/workflows/**'
            boot:
              - 'versions.env'
              - 'scripts/boot-smoke.sh'
              - '.github/workflows/**'
            integration:
              - 'migrations/**'
              - 'internal/storage/**'
              - 'pkg/kv/**'
              - 'app/pipeline/**'
              - 'jobq/**'
              - 'integration/**'
              - '**/*integration_test.go'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            clickhouse:
              - 'pkg/usage/clickhouse/**'
              - 'pkg/payload/clickhouse/**'
              - 'pkg/chttl/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  # The light tier in one job: lint, unit tests and, when the paths call for
  # them, chart lint and the integration and ClickHouse tests, in parallel
  # (scripts/ci-dev.sh). Integration runs only the packages the change can
  # reach. On the cluster, pull requests into dev run on the warm pool when
  # CI_WARM_POOL is on (its job hook admits nothing else); everything else, and
  # dev while the switch is off, runs on the cold integration pool. A pool that
  # cannot take the job would leave it queued, so the switch is explicit.
  dev:
    needs: changes
    if: needs.changes.outputs.full != 'true' && (needs.changes.outputs.go == 'true' || needs.changes.outputs.chart == 'true')
    runs-on: ${{ needs.changes.outputs.cluster == 'true' && (vars.CI_WARM_POOL == 'on' && github.base_ref == 'dev' && 'relay-ci-warm' || 'relay-ci-integration') || 'ubuntu-latest' }}
    # Both cluster pools run Postgres, Valkey and ClickHouse as pod sidecars on
    # the same addresses. An empty image skips a service.
    services:
      postgres:
        image: ${{ needs.changes.outputs.cluster != 'true' && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_DB: relay_test
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay -d relay_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
      valkey:
        image: ${{ needs.changes.outputs.cluster != 'true' && 'valkey/valkey:8-alpine' || '' }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
      clickhouse:
        image: ${{ needs.changes.outputs.cluster != 'true' && 'clickhouse/clickhouse-server:24.8-alpine' || '' }}
        env:
          CLICKHOUSE_USER: relay
          CLICKHOUSE_PASSWORD: relay
        ports:
          - 9000:9000
        options: >-
          --health-cmd "clickhouse-client --user relay --password relay --query 'SELECT 1'"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      RELAY_TEST_PG_DSN: postgres://relay:relay@127.0.0.1:5432/relay_test?sslmode=disable
      RELAY_TEST_REDIS_ADDR: 127.0.0.1:6379
      RELAY_TEST_CH_DSN: clickhouse://relay:relay@127.0.0.1:9000/default
    steps:
      # Depth 2: the pull request's merge commit and its base, for the diff.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-go@v7
        if: runner.environment == 'github-hosted'
        with:
          go-version: '1.26'
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-only: true
          skip-cache: ${{ runner.environment == 'self-hosted' }}

      - uses: azure/setup-helm@v5
        if: runner.environment == 'github-hosted' && needs.changes.outputs.chart == 'true'

      - name: Checks
        env:
          GO: ${{ needs.changes.outputs.go }}
          CHART: ${{ needs.changes.outputs.chart }}
          INTEGRATION: ${{ needs.changes.outputs.integration }}
          CLICKHOUSE: ${{ needs.changes.outputs.clickhouse }}
          CHANGED_FROM: HEAD^1
        run: |
          parts=()
          [ "$GO" = true ] && parts+=(lint test)
          [ "$CHART" = true ] && parts+=(chart)
          [ "$GO" = true ] && [ "$INTEGRATION" = true ] && parts+=(integration)
          [ "$GO" = true ] && [ "$CLICKHOUSE" = true ] && parts+=(clickhouse)
          scripts/ci-dev.sh "${parts[@]}"

  # golangci-lint runs govet (integration tag included), so there is no
  # separate vet step.
  lint:
    needs: changes
    if: needs.changes.outputs.go == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ${{ needs.changes.outputs.cluster == 'true' && 'relay-ci' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        if: runner.environment == 'github-hosted'
        with:
          go-version: '1.26'
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Codebase rules (canonical-protocol 1/2/4/10)
        run: make lint-rules

      # Installs the pinned binary and, on GitHub-hosted runners, restores its
      # analysis cache (self-hosted runners keep it on a volume); make lint
      # runs it over every module.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-only: true
          skip-cache: ${{ runner.environment == 'self-hosted' }}

      - name: golangci-lint
        run: make lint

      - name: Build
        run: |
          go build ./...
          (cd sdk && go build ./...)
          (cd jobq && go build ./...)
          (cd auth && go build ./...)

  # Every module's unit tests, once, under -race and writing the unit
  # coverprofiles the coverage job merges.
  test:
    needs: changes
    if: needs.changes.outputs.go == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ${{ needs.changes.outputs.cluster == 'true' && 'relay-ci' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        if: runner.environment == 'github-hosted'
        with:
          go-version: '1.26'
          cache: true

      # The full tier gates releases, and the cluster pool shares its Go cache
      # with pull-request jobs: no result comes from that cache.
      - name: Test (race, coverage)
        env:
          GOFLAGS: -count=1
        run: make test-race-cover

      - uses: actions/upload-artifact@v7
        with:
          name: unit-coverage
          path: .cover/*.out
          include-hidden-files: true
          if-no-files-found: error

  fuzz:
    needs: changes
    if: needs.changes.outputs.go == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ${{ needs.changes.outputs.cluster == 'true' && 'relay-ci' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        if: runner.environment == 'github-hosted'
        with:
          go-version: '1.26'
          cache: true

      - name: Fuzz
        run: make test-fuzz

      - name: Authz equivalence (no -race)
        run: make test-equivalence

  bench:
    needs: changes
    if: needs.changes.outputs.go == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ${{ needs.changes.outputs.cluster == 'true' && 'relay-ci' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        if: runner.environment == 'github-hosted'
        with:
          go-version: '1.26'
          cache: true

      - name: Allocation gate
        run: make bench-gate

  govulncheck:
    needs: changes
    if: needs.changes.outputs.full == 'true' && (needs.changes.outputs.go == 'true' || github.event_name == 'schedule')
    runs-on: ${{ needs.changes.outputs.cluster == 'true' && 'relay-ci' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        if: runner.environment == 'github-hosted'
        with:
          go-version: '1.26'
          cache: true

      - name: govulncheck
        run: make vulncheck

  # Dependency vulnerabilities, misconfigurations (Dockerfile, chart rendered
  # with default values) and committed secrets. Every finding goes to code
  # scanning; only fixable HIGH/CRITICAL vulnerabilities and secrets fail the
  # job, since misconfiguration checks need per-finding triage.
  trivy:
    needs: changes
    if: needs.changes.outputs.scan == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ${{ needs.changes.outputs.cluster == 'true' && 'relay-ci' || 'ubuntu-latest' }}
    permissions:
      contents: read
      security-events: write
    # Only the vulnerability DB and checks bundle are fetched; no update check or telemetry.
    env:
      TRIVY_SKIP_VERSION_CHECK: 'true'
      TRIVY_DISABLE_TELEMETRY: 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Install trivy
        run: |
          ./scripts/install-trivy.sh "$RUNNER_TEMP/trivy"
          echo "$RUNNER_TEMP/trivy" >> "$GITHUB_PATH"

      - name: Scan
        run: |
          trivy fs --scanners vuln,misconfig,secret --helm-set secrets.existingSecret=relay \
            --format json --output "$RUNNER_TEMP/trivy.json" .
          trivy convert --scanners vuln,misconfig,secret --format table "$RUNNER_TEMP/trivy.json"
          trivy convert --format sarif --output "$RUNNER_TEMP/trivy.sarif" "$RUNNER_TEMP/trivy.json"

      # A fork's token cannot write security events.
      - uses: github/codeql-action/upload-sarif@v4
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          sarif_file: ${{ runner.temp }}/trivy.sarif
          category: trivy-fs

      - name: Fail on fixable HIGH/CRITICAL vulnerabilities and secrets
        run: |
          trivy fs --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed \
            --skip-db-update --exit-code 1 .

  # Integration-tagged tests against Postgres and Valkey services. Each test
  # gets a database of its own on both, so packages run in parallel.
  integration:
    needs: changes
    if: needs.changes.outputs.go == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ${{ needs.changes.outputs.cluster == 'true' && 'relay-ci-integration' || 'ubuntu-latest' }}
    # The cluster pool runs Postgres and Valkey as pod sidecars on the same
    # addresses. An empty image skips a service ('' is falsy, hence the order).
    services:
      postgres:
        image: ${{ needs.changes.outputs.cluster != 'true' && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_DB: relay_test
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay -d relay_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
      valkey:
        image: ${{ needs.changes.outputs.cluster != 'true' && 'valkey/valkey:8-alpine' || '' }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      RELAY_TEST_PG_DSN: postgres://relay:relay@127.0.0.1:5432/relay_test?sslmode=disable
      RELAY_TEST_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        if: runner.environment == 'github-hosted'
        with:
          go-version: '1.26'
          cache: true

      - name: Integration tests
        run: make test-integration-run

      - uses: actions/upload-artifact@v7
        with:
          name: integration-coverage
          path: .cover/*.out
          include-hidden-files: true
          if-no-files-found: error

  # Merges the unit profiles of every module with the integration profiles:
  # store packages only get credit from the integration run.
  coverage:
    runs-on: ${{ needs.changes.outputs.cluster == 'true' && 'relay-ci' || 'ubuntu-latest' }}
    needs: [changes, test, integration]
    if: needs.changes.outputs.go == 'true' && needs.changes.outputs.full == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: '*-coverage'
          merge-multiple: true
          path: .cover

      - name: Coverage tiers
        run: make cover-check COVER_ENFORCE=1

  # The ClickHouse sink tests. GitHub-hosted only: it needs a ClickHouse
  # service container, which the cluster pool does not run.
  clickhouse:
    needs: changes
    if: needs.changes.outputs.go == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8-alpine
        # No CLICKHOUSE_DB: creating it makes the image run a temporary server
        # first, which can pass the health check before the real one listens.
        env:
          CLICKHOUSE_USER: relay
          CLICKHOUSE_PASSWORD: relay
        ports:
          - 9000:9000
        options: >-
          --health-cmd "clickhouse-client --user relay --password relay --query 'SELECT 1'"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      RELAY_TEST_CH_DSN: clickhouse://relay:relay@127.0.0.1:9000/default
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: ClickHouse tests
        run: make test-clickhouse-run

  chart:
    needs: changes
    if: needs.changes.outputs.chart == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ${{ needs.changes.outputs.cluster == 'true' && 'relay-ci' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        if: runner.environment == 'github-hosted'
      - name: helm lint
        run: helm lint chart

  # Builds and boots relay with the UI and catalog versions.env pins, against
  # an empty Postgres: a bump naming a missing or broken release fails here.
  # GitHub-hosted only: it needs a Postgres service container.
  boot:
    needs: changes
    if: needs.changes.outputs.boot == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: relay
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay -d relay"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      RELAY_PG_DSN: postgres://relay:relay@127.0.0.1:5432/relay?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Boot smoke
        run: ./scripts/boot-smoke.sh
