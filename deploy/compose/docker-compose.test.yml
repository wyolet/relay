# Throwaway Postgres and Dragonfly for `make test-integration`. Spun up, used,
# torn down. Ephemeral storage, no port collision with dev-stack (binds to
# 127.0.0.1:5499 / 6399 to dodge the standard 5432 / 6379 conventions).
# Own project name: `make test-integration` ends with `down -v`, which must
# never reach another stack started from this directory.
name: relay-test
services:
  pg-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: relay_test
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
    ports:
      - "127.0.0.1:5499:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay_test"]
      interval: 1s
      timeout: 2s
      retries: 30

  dragonfly-test:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.2
    command: ["--logtostderr", "--cluster_mode=emulated", "--lock_on_hashtags", "--proactor_threads=2", "--dbfilename="]
    ulimits:
      memlock: -1
    ports:
      - "127.0.0.1:6399:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 30
